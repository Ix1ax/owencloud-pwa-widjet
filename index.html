<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Котёл</title>
  <meta name="theme-color" content="#1b2433">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Котёл">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Главный экран -->
  <main id="main" class="screen" hidden>
    <header class="top">
      <span id="deviceName" class="device">Котёл</span>
      <button id="openSettings" class="icon-btn" aria-label="Настройки">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm7.43-2.53a7.8 7.8 0 0 0 0-1.94l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.68-.97l-.38-2.65A.5.5 0 0 0 14 2.5h-4a.5.5 0 0 0-.5.42l-.38 2.65c-.6.25-1.17.57-1.68.97l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.5.5 0 0 0 .12.64l2.11 1.65a7.8 7.8 0 0 0 0 1.94l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46c.13.22.39.3.61.22l2.49-1c.51.4 1.08.72 1.68.97l.38 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.38-2.65c.6-.25 1.17-.57 1.68-.97l2.49 1c.22.08.48 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.65Z"/></svg>
      </button>
    </header>

    <section class="card temp-card" aria-live="polite">
      <div class="label">Температура</div>
      <div class="temp"><span id="tempValue">—</span><span class="deg">°</span></div>
      <div class="meta">
        <span id="statusDot" class="dot"></span>
        <span id="statusText">Загрузка…</span>
      </div>
    </section>

    <section class="card reset-card">
      <div class="row">
        <div class="label">Reset</div>
        <div id="resetValue" class="reset-value">—</div>
      </div>
      <div class="buttons">
        <button id="reset1" class="btn btn-danger">RESET 1</button>
        <button id="reset0" class="btn btn-neutral">RESET 0</button>
      </div>
      <div id="writeMsg" class="write-msg" role="status"></div>
    </section>

    <button id="refresh" class="refresh">Обновить</button>
  </main>

  <!-- Настройки -->
  <section id="settings" class="screen" hidden>
    <header class="top">
      <span class="device">Настройки</span>
      <button id="closeSettings" class="icon-btn" aria-label="Закрыть" hidden>✕</button>
    </header>

    <form id="loginForm" class="card form">
      <div class="step">1. Вход в OwenCloud</div>
      <label>Email
        <input id="login" type="email" autocomplete="username" required placeholder="name@mail.ru">
      </label>
      <label>Пароль
        <input id="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="btn btn-primary" type="submit">Войти</button>
      <div id="loginMsg" class="form-msg"></div>
    </form>

    <form id="paramForm" class="card form" hidden>
      <div class="step">2. Прибор и параметры</div>
      <label>Прибор
        <select id="deviceSelect"></select>
      </label>
      <label>Температура
        <select id="tempSelect"></select>
      </label>
      <label>Reset
        <select id="resetSelect"></select>
      </label>
      <label class="check"><input id="confirmWrite" type="checkbox" checked> Спрашивать подтверждение перед записью</label>
      <button class="btn btn-primary" type="submit">Сохранить</button>
      <div id="paramMsg" class="form-msg"></div>
    </form>

    <div class="card hint">
      Логин и пароль хранятся только на этом телефоне (в памяти браузера) и отправляются только на api.owencloud.ru.
      <button id="logout" class="link-btn" type="button">Выйти и стереть данные</button>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
